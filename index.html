<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waypoint – study and trip planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#eef1f4;--surf:#fff;--ink:#142030;--mut:#5d6b7a;--line:#d9e0e7;--line2:#e7ebf0;--study:#1f7a4d;--studysoft:#e3f3ea;--trip:#6b7886;--tripsoft:#e7ebf0;--hero:#0f3d2a;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1319;--surf:#161d26;--ink:#e7ecf2;--mut:#93a1b1;--line:#263140;--line2:#1e2733;--study:#5fcf93;--studysoft:#15301f;--trip:#93a1b1;--tripsoft:#1e2733;--hero:#123d2b;--onacc:#0e1319}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1319;--surf:#161d26;--ink:#e7ecf2;--mut:#93a1b1;--line:#263140;--line2:#1e2733;--study:#5fcf93;--studysoft:#15301f;--trip:#93a1b1;--tripsoft:#1e2733;--hero:#123d2b;--onacc:#0e1319}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#app{max-width:1040px;margin:0 auto;padding:24px 20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0}
nav{display:flex;gap:2px;background:var(--line2);padding:3px;border-radius:11px}
nav button{border:0;background:none;padding:7px 18px;border-radius:8px;color:var(--mut);font-weight:500}
nav button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(20,32,48,.14)}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:8px 14px;transition:background .15s,color .15s,filter .15s}
button:hover{background:var(--line2)}
button.pri{background:var(--study);color:var(--onacc);border:0;font-weight:600;padding:9px 18px}
button.pri:hover{filter:brightness(1.1);background:var(--study)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--study);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}
input::placeholder{color:var(--mut)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;padding:0;border:1.5px solid var(--mut);border-radius:5px;display:grid;place-content:center;flex:none;margin:1px 0 0;cursor:pointer}
input[type=checkbox]:checked{background:var(--study);border-color:var(--study)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--onacc);border-bottom:2px solid var(--onacc);transform:translateY(-1px) rotate(-45deg)}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.add input:first-child{flex:2 1 220px}.add input,.add select{flex:1 1 120px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center;background:var(--hero);color:#ecf7f0;border-radius:18px;padding:24px 30px;margin-bottom:18px}
.big{font-size:68px;font-weight:700;letter-spacing:-.045em;line-height:1}
.hero small{display:block;opacity:.72;font-size:13px}
.hero b{font-weight:600}
.prog{height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:#7be0a8;border-radius:9px}
.nx{text-align:right;max-width:200px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar b{flex:1;font-size:17px;font-weight:600;letter-spacing:-.01em}
.wk{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day{padding:14px 10px 16px;border-left:1px solid var(--line2);min-height:170px}
.day:first-child{border-left:0}
.day.now{box-shadow:inset 0 3px 0 var(--study)}
.dw{font-size:12px;color:var(--mut)}
.dn{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.day.now .dn{color:var(--study)}
.it{display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.35;padding:6px 7px;margin-top:5px;border-radius:7px;border-left:3px solid var(--study);background:var(--studysoft)}
.it.p{border-color:var(--trip);background:var(--tripsoft)}
.it.done span{text-decoration:line-through;color:var(--mut)}
.it input{width:15px;height:15px}
.it time{color:var(--mut);margin-right:5px}
.free{font-size:13px;color:var(--mut)}
.list{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);border-left:3px solid transparent}
.row:first-child{border-top:0}
.row.s{border-left-color:var(--trip)}.row.a{border-left-color:var(--study)}
.g{flex:1;min-width:0}.g b{font-weight:600}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.row.done .g b{text-decoration:line-through;color:var(--mut)}
.tm{width:64px;flex:none;font-weight:600}.tm.mut{font-weight:400;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);padding:2px 9px;font-size:19px;line-height:1.2}
.x:hover{background:var(--line2);color:var(--ink)}
.tag{font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--tripsoft);color:var(--trip);white-space:nowrap}
.tag.k{background:var(--line2);color:var(--mut)}
.empty{padding:26px 16px;color:var(--mut);text-align:center}
.dg{margin-bottom:24px}
.dg h3{margin:0 0 9px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.dg h3 span{color:var(--mut);font-weight:400;margin-left:10px;font-size:14px}
.rev{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:24px 20px 22px;text-align:center;margin-bottom:18px}
.rev .prog{background:var(--line2);max-width:260px;margin:0 auto 6px}.rev .prog i{background:var(--study)}
.face{font-size:28px;font-weight:600;letter-spacing:-.02em;padding:26px 8px;min-height:120px;display:grid;place-items:center}
@media (max-width:820px){
 .wk{grid-template-columns:1fr}
 .day{display:grid;grid-template-columns:56px 1fr;gap:10px;min-height:0;border-left:0;border-top:1px solid var(--line2)}
 .day:first-child{border-top:0}
 .day.now{box-shadow:inset 3px 0 0 var(--study)}
 .it:first-child{margin-top:0}
 .hero{grid-template-columns:auto 1fr;gap:20px;padding:20px}.nx{grid-column:1/-1;text-align:left;max-width:none}
 .big{font-size:56px}
}
.al{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;flex:1 1 240px}.al input{flex:1}
.rg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));z-index:20;display:grid;gap:8px}
.rr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--study);border-left-width:4px;border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(20,32,48,.22)}
.rr>div{flex:1 1 160px;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="ring"></div><div id="app"></div>
<script>
const KEY='waypoint-v1',$=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const P=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=iso(new Date()),T0=P(today);
const days=(a,b)=>Math.round((P(a)-P(b))/864e5);
const fmt=(s,o)=>P(s).toLocaleDateString(undefined,o||{month:'short',day:'numeric'});
const rel=s=>{const n=days(s,today);return n===0?'Today':n===1?'Tomorrow':n<0?Math.abs(n)+' days overdue':'In '+n+' days'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const byTime=(a,b)=>(a.time||'').localeCompare(b.time||'');
const K=['Travel','Stay','Sight','Food','Other'];
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tasks){
  const d=n=>iso(add(T0,n));
  S={tasks:[
    {id:uid(),title:'Problem set',subject:'Math',due:d(2),done:false},
    {id:uid(),title:'Presentation outline',subject:'History',due:d(5),done:false},
    {id:uid(),title:'Book accommodation',subject:'Trip prep',due:d(3),done:false},
    {id:uid(),title:'Learn 20 travel phrases',subject:'Trip prep',due:d(8),done:false}],
  trip:[
    {id:uid(),title:'Depart for airport',date:d(10),time:'08:30',kind:'Travel',note:'Terminal 2'},
    {id:uid(),title:'Hotel check-in',date:d(10),time:'15:00',kind:'Stay',note:''},
    {id:uid(),title:'Museum visit',date:d(11),time:'10:00',kind:'Sight',note:'Book tickets ahead'},
    {id:uid(),title:'Dinner reservation',date:d(11),time:'19:30',kind:'Food',note:''}],
  cards:[
    {id:uid(),front:'Where is the station?',back:'Où est la gare ?',deck:'Travel phrases'},
    {id:uid(),front:'The bill, please',back:'L’addition, s’il vous plaît',deck:'Travel phrases'},
    {id:uid(),front:'How much is it?',back:'C’est combien ?',deck:'Travel phrases'}]};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view='week',wk=0,q=[],qn=0,show=false;

function range(){const d=S.trip.map(x=>x.date).sort();return d.length?[d[0],d[d.length-1]]:null}
function hero(){
  const r=range(),open=S.tasks.filter(t=>!t.done);
  const next=[...open].sort((a,b)=>a.due.localeCompare(b.due))[0];
  const prep=S.tasks.filter(t=>t.subject==='Trip prep'),pd=prep.filter(t=>t.done).length;
  let n='–',l='no trip yet',sub='Add stops on the Trip tab to start a countdown';
  if(r){const k=days(r[0],today);
    if(k>0){n=k;l=k===1?'day to go':'days to go'}else if(today<=r[1]){n='Now';l='on the trip'}else{n='Done';l='trip finished'}
    sub=fmt(r[0])+' to '+fmt(r[1])}
  return `<div class="hero"><div><div class="big">${n}</div><small>${l}</small></div>
  <div><b>${sub}</b><small>${prep.length?pd+' of '+prep.length+' prep tasks done':'No prep tasks yet'}</small><div class="prog"><i style="width:${prep.length?pd/prep.length*100:0}%"></i></div></div>
  <div class="nx"><small>Next due</small><b>${next?esc(next.title):'Nothing due'}</b><small>${next?rel(next.due):''}</small></div></div>`;
}
function weekView(){
  const s=add(T0,-((T0.getDay()+6)%7)+wk*7);
  let h=`<div class="bar"><b>${fmt(iso(s),{month:'long',day:'numeric'})} to ${fmt(iso(add(s,6)),{month:'long',day:'numeric'})}</b><button data-a="wk" data-n="-1" aria-label="Previous week">‹</button><button data-a="wk" data-n="0">This week</button><button data-a="wk" data-n="1" aria-label="Next week">›</button></div>${hero()}<div class="wk">`;
  for(let i=0;i<7;i++){
    const d=iso(add(s,i)),ts=S.tasks.filter(t=>t.due===d),ps=S.trip.filter(x=>x.date===d).sort(byTime);
    h+=`<div class="day${d===today?' now':''}"><div><div class="dw">${fmt(d,{weekday:'short'})}</div><div class="dn">${P(d).getDate()}</div></div><div>`
    +ts.map(t=>`<label class="it${t.done?' done':''}"><input type="checkbox" data-a="tog" data-id="${t.id}" ${t.done?'checked':''}><span>${esc(t.title)}</span></label>`).join('')
    +ps.map(x=>`<div class="it p"><span>${x.time?`<time>${esc(x.time)}</time>`:''}${esc(x.title)}</span></div>`).join('')
    +(ts.length+ps.length?'':'<span class="free">Free</span>')+'</div></div>';
  }
  return h+'</div>';
}
function taskView(){
  const l=[...S.tasks].sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due)),r=range();
  const subs=[...new Set(['Trip prep',...S.tasks.map(t=>t.subject)])];
  return `<div class="add"><input id="tt" placeholder="Assignment or prep task"><input id="ts" placeholder="Subject" list="subs"><input id="td" type="date" value="${today}"><label class="al">Alarm<input id="ta" type="datetime-local"></label><button class="pri" data-a="addt">Add task</button></div><p class="free" style="margin:-6px 0 14px">Alarms ring while this page is open. Allow notifications if your browser asks.</p>
  <datalist id="subs">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><div class="list">`
  +(l.length?'':'<div class="empty">No tasks yet. Add an assignment above.</div>')
  +l.map(t=>`<div class="row a${t.done?' done':''}"><input type="checkbox" data-a="tog" data-id="${t.id}" ${t.done?'checked':''}>
  <div class="g"><b>${esc(t.title)}</b><div class="meta"><span>${esc(t.subject||'General')}</span><span>${fmt(t.due)}</span><span>${t.done?'Done':rel(t.due)}</span>${t.alarm?`<span>Alarm ${fmtA(t.alarm)}</span>`:''}</div></div>
  ${r&&!t.done&&t.due>=r[0]&&t.due<=r[1]?'<span class="tag">During trip</span>':''}
  <button class="x" data-a="del" data-k="tasks" data-id="${t.id}" aria-label="Delete task">×</button></div>`).join('')+'</div>';
}
function tripView(){
  const r=range(),ds=[...new Set(S.trip.map(x=>x.date))].sort();
  let h=`<div class="add"><input id="pt" placeholder="Flight, stay, or activity"><input id="pd" type="date" value="${r?r[0]:today}"><input id="pm" type="time"><select id="pk">${K.map(k=>`<option>${k}</option>`).join('')}</select><input id="pn" placeholder="Note or address"><button class="pri" data-a="addp">Add stop</button></div>`;
  if(!ds.length)h+='<div class="list"><div class="empty">No stops yet. Add flights, stays, and plans above.</div></div>';
  ds.forEach(d=>{
    h+=`<div class="dg"><h3>Day ${days(d,ds[0])+1}<span>${fmt(d,{weekday:'long',month:'long',day:'numeric'})}</span></h3><div class="list">`
    +S.trip.filter(x=>x.date===d).sort(byTime).map(x=>`<div class="row s"><span class="tm">${esc(x.time||'All day')}</span><div class="g"><b>${esc(x.title)}</b>${x.note?`<div class="meta">${esc(x.note)}</div>`:''}</div><span class="tag k">${esc(x.kind)}</span><button class="x" data-a="del" data-k="trip" data-id="${x.id}" aria-label="Delete stop">×</button></div>`).join('')
    +S.tasks.filter(t=>t.due===d&&!t.done).map(t=>`<div class="row a"><span class="tm mut">Due</span><div class="g"><b>${esc(t.title)}</b><div class="meta"><span>${esc(t.subject||'General')}</span></div></div></div>`).join('')
    +'</div></div>';
  });
  return h;
}
function cardView(){
  let h=`<div class="add"><input id="cf" placeholder="Front"><input id="cb" placeholder="Back"><input id="cd" placeholder="Deck" value="Travel phrases"><button class="pri" data-a="addc">Add card</button></div>`;
  const c=q.length&&S.cards.find(x=>x.id===q[0]);
  if(c)h+=`<div class="rev"><div class="prog"><i style="width:${qn?(qn-q.length)/qn*100:0}%"></i></div><small class="free">${q.length} left in ${esc(c.deck)}</small><div class="face">${esc(show?c.back:c.front)}</div>`
    +(show?`<button data-a="again">Again</button> <button class="pri" data-a="got">Got it</button>`:`<button class="pri" data-a="flip">Show answer</button>`)+'</div>';
  else h+=`<p><button class="pri" data-a="start" ${S.cards.length?'':'disabled'}>Start review (${S.cards.length} cards)</button></p>`;
  return h+'<div class="list">'+(S.cards.length?'':'<div class="empty">No cards yet. Add one above.</div>')+S.cards.map(c=>`<div class="row"><div class="g"><b>${esc(c.front)}</b><div class="meta"><span>${esc(c.back)}</span><span>${esc(c.deck)}</span></div></div><button class="x" data-a="del" data-k="cards" data-id="${c.id}" aria-label="Delete card">×</button></div>`).join('')+'</div>';
}
function render(){
  const tabs=[['week','Week'],['tasks','Tasks'],['trip','Trip'],['cards','Cards']];
  const v={week:weekView,tasks:taskView,trip:tripView,cards:cardView}[view]();
  $('#app').innerHTML=`<div class="top"><h1>Waypoint</h1><nav>${tabs.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${view===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav></div>${v}`;
}
const val=id=>($('#'+id)||{}).value||'';
function act(el){
  const a=el.dataset.a,id=el.dataset.id;
  if(a==='snz'||a==='dis'){ringAct(a,id);return}
  if(a==='tab')view=el.dataset.v;
  else if(a==='wk')wk=el.dataset.n==='0'?0:wk+Number(el.dataset.n);
  else if(a==='tog'){const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;if(t.done)t.ringing=false}}
  else if(a==='del'){const k=el.dataset.k;S[k]=S[k].filter(x=>x.id!==id);q=q.filter(x=>x!==id)}
  else if(a==='addt'){if(!val('tt').trim())return;S.tasks.push({id:uid(),title:val('tt').trim(),subject:val('ts').trim(),due:val('td')||today,done:false,alarm:val('ta'),fired:false});if(val('ta')){try{Notification.requestPermission()}catch(e){}}}
  else if(a==='addp'){if(!val('pt').trim()||!val('pd'))return;S.trip.push({id:uid(),title:val('pt').trim(),date:val('pd'),time:val('pm'),kind:val('pk'),note:val('pn').trim()})}
  else if(a==='addc'){if(!val('cf').trim()||!val('cb').trim())return;S.cards.push({id:uid(),front:val('cf').trim(),back:val('cb').trim(),deck:val('cd').trim()||'General'})}
  else if(a==='start'){q=S.cards.map(c=>c.id).sort(()=>Math.random()-.5);qn=q.length;show=false}
  else if(a==='flip')show=true;
  else if(a==='got'){q.shift();show=false}
  else if(a==='again'){q.push(q.shift());show=false}
  save();render();showRing();
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b)act(b)});
document.addEventListener('change',e=>{if(e.target.matches('input[data-a]'))act(e.target)});
const fmtA=s=>new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const ldt=d=>iso(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.1);o.start();o.stop(c.currentTime+1.1)}catch(e){}}
function notify(t){try{if('Notification' in window&&Notification.permission==='granted')new Notification('Task alarm: '+t.title)}catch(e){}}
function showRing(){
  const l=S.tasks.filter(t=>t.ringing);
  $('#ring').innerHTML=l.length?`<div class="rg" role="alert">${l.map(t=>`<div class="rr"><div><b>${esc(t.title)}</b><div class="meta"><span>${esc(t.subject||'General')}</span><span>Due ${fmt(t.due)}</span></div></div><button data-a="snz" data-id="${t.id}">Snooze 10 min</button><button class="pri" data-a="dis" data-id="${t.id}">Dismiss</button></div>`).join('')}</div>`:'';
}
function ringAct(a,id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.ringing=false;if(a==='snz'){t.alarm=ldt(new Date(Date.now()+6e5));t.fired=false}save();showRing();render()}
function check(){let hit=false;S.tasks.forEach(t=>{if(t.alarm&&!t.done&&!t.fired&&new Date(t.alarm).getTime()<=Date.now()){t.fired=t.ringing=true;hit=true;notify(t)}});if(hit){save();beep();setTimeout(beep,1400);showRing()}}
setInterval(check,15000);
render();check();showRing();
</script></body></html>
